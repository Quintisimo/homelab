configs:
  glance.yml:
    file: ./glance.yml

name: glance

services:
  glance:
    configs:
      - source: glance.yml
        target: /app/config/glance.yml
    container_name: glance
    env_file:
      - secrets.enc.env
    image: glanceapp/glance:latest@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    network_mode: host
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
