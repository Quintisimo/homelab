configs:
  glance.yml:
    file: ./glance.yml

name: glance

services:
  glance:
    configs:
      - source: glance.yml
        target: /app/config/glance.yml
    container_name: glance
    env_file:
      - secrets.enc.env
    image: glanceapp/glance:latest@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    network_mode: host
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
